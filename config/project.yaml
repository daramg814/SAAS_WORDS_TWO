
project:
  name: SAAS_WORDS_TWO
  timezone: Asia/Seoul
  repository: https://github.com/daramg814/SAAS_WORDS_TWO.git
  branch: main

execution:
  default_mode: production
  production:
    target_title_count: 500
    output_root: output/deliverables/generated
    update_production_history: true
  qa:
    target_title_count: 20
    minimum_target_title_count: 10
    output_root: output/_pipeline/qa
    update_production_history: false

collection:
  recent_months_required: 24
  retry_attempts: 3
  incremental: true
  hacker_news:
    stories_per_list: 500
    comments_per_story: 20
    max_items_per_run: 800
    search_hits_per_pattern: 1000
    search_max_items_per_run: 8000
    supply_hits_per_problem: 20
    industry_term_hits_per_pattern: 50
    industry_term_search_max_items_per_run: 2000
  gh_archive:
    max_hours_per_run: 12
  stack_exchange_dump:
    max_items_per_run: 5000
  app_store_reviews:
    max_items_per_run: 3000

thresholds:
  demand_score_min: 45
  independent_users_min: 5
  supply_scarcity_score_min: 65
  opportunity_score_min: 65
  allowed_confidence: [A, B]
  allowed_scarcity_grades: [S, A, B]

opportunity_scoring:
  demand_weight: 0.35
  supply_scarcity_weight: 0.65
  scarcity_bonus:
    effective_supply_0_to_2: 10
    effective_supply_over_2_to_5: 5
    effective_supply_over_5: 0

title_generation:
  first_round_multiplier: 1.6
  first_round_min_extra: 20
  next_round_shortage_multiplier: 2
  max_rounds: 5
  minimum_opportunities: 5
  maximum_share_per_opportunity: 0.30
  title_case: true
  words_per_title: 2
  alphabet_only: true
  allow_hyphen: false
  line_ending: LF

human_google_calibration:
  enabled: true
  default_country: KR
  default_language: ko
  market_queue_size: 20
  title_queue_size: 30
  maximum_human_weight: 0.25
  maximum_count_only_weight: 0.125
  observations_for_full_weight: 20
  minimum_repetitions_for_rule_promotion: 5

paths:
  production_history: output/deliverables/history/words.txt
  normalized_history: output/deliverables/history/words.normalized.txt
  opportunities: output/_pipeline/final/opportunities.jsonl
  google_queue: output/deliverables/review/google_validation_queue.csv
  google_input: input/human_google_checks.csv
  google_observations: memory/human_feedback/google_supply_observations.jsonl
  calibration_metrics: memory/human_feedback/google_calibration_metrics.json

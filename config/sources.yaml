
sources:
  hacker_news:
    enabled: true
    required: true
    type: official_api
    base_url: https://hacker-news.firebaseio.com/v0
    incremental_cursor: data/cache/hacker_news_last_id.txt
  stack_exchange_dump:
    enabled: true
    required: false
    activation_gate: access_test_pass
    site: softwarerecs.stackexchange.com
    dump_cache_path: data/raw/stack_exchange/softwarerecs.stackexchange.com.7z
  gh_archive:
    enabled: true
    required: false
    activation_gate: access_test_pass
    recent_days_min: 30
    recent_days_max: 90
    incremental_cursor: data/cache/gh_archive_last_hour.txt
  common_crawl:
    enabled: true
    required: false
    activation_gate: access_test_pass
    scope: known_candidate_domains_only
  npm_registry:
    enabled: true
    required: false
    activation_gate: access_test_pass
  official_feeds:
    enabled: true
    required: false
    activation_gate: access_test_pass
    feed_urls:
      - https://github.blog/feed/
      - https://github.blog/changelog/feed/
  app_store_reviews:
    enabled: true
    required: false
    activation_gate: access_test_pass
    # DEMAND-001 follow-up (2026-08-11): a fundamentally different kind of
    # data source than the developer/software-community text tried so far
    # (HN/GH Archive/Stack Exchange all share the same boilerplate-heavy
    # failure mode - see memory/ACTIVE_ISSUES.md DEMAND-001). Real end users,
    # each a distinct app reviewer, describe concrete complaints/workarounds
    # about existing B2B/B2C SaaS-category apps in their own words via
    # Apple's official, key-free iTunes Search + customer-review RSS APIs
    # (Reddit's public JSON API, CFPB's complaint API, and Product Hunt's
    # GraphQL API were all probed first and found to require credentials
    # this session cannot self-provision, or to be blocked outright - see
    # docs/policies/04-data-source-policy.md for the full comparison).
    country: us
    search_terms:
      - small business invoicing
      - expense tracking app
      - small business CRM
      - appointment scheduling app
      - employee time tracking
      - project management small business
      - inventory management small business
      - customer support helpdesk
      - email marketing small business
      - receipt scanner app
      - contract management app
      - subscription tracker app
    apps_per_term: 5

prohibited:
  - google_keyword_planner
  - google_trends_dependency
  - google_serp_scraping
  - captcha_bypass
  - browser_automation_for_google_results
  - indiscriminate_web_crawling
